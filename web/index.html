<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Watchlight · Service status</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <div class="identity"><a class="brand" href="/">◈ Watchlight</a><span id="owner-title" hidden><span class="divider" aria-hidden="true">|</span> Owner dashboard</span></div>
      <nav>
        <a href="/">Public status</a><a href="/dashboard">Owner dashboard</a>
      </nav>
    </header>
    <main>
      <div class="heading">
        <h1>Service status</h1>
        <div class="page-meta"><section id="delivery" hidden aria-label="Monitoring health"></section><span id="updated">Connecting…</span></div>
      </div>
      <section id="summary" class="summary unknown" aria-live="polite">
        Waiting for monitoring data
      </section>
      <div class="layout">
        <aside>
          <h2>Services</h2>
          <div id="services"></div>
        </aside>
        <section id="detail">
          <p>Select a service to see its history.</p>
        </section>
      </div>
      <footer class="note">Uptime is the percentage of successful observed checks in the selected window. Unobserved time is excluded.</footer>
    </main>
  </body>
</html>
